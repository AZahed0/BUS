
name: Publiceer kaart op GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5

      - name: Websitebestanden uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
